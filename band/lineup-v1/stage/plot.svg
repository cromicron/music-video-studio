<text x="1065" y="226" class="small"><tspan x="1065" dy="0">Five identities. Yaro remains</tspan><tspan x="1065" dy="24">the existing brown-haired lead.</tspan><tspan x="1065" dy="46">Only Dario wears a cross.</tspan><tspan x="1065" dy="46">Guitarist is blonde, distinct</tspan><tspan x="1065" dy="24">from the narrative redhead.</tspan><tspan x="1065" dy="46">Keys rear-left; drummer</tspan><tspan x="1065" dy="24">rear-centre, visible above lead.</tspan><tspan x="1065" dy="46">Preserve instrument handedness</tspan><tspan x="1065" dy="24">and physical support/contact.</tspan><tspan x="1065" dy="46">Rear views reverse screen sides;</tspan><tspan x="1065" dy="24">motivate them explicitly.</tspan><tspan x="1065" dy="46">Identity lineup order is NOT</tspan><tspan x="1065" dy="24">the stage arrangement.</tspan></text>
